# Install as /etc/nginx/sites-available/language-translator
# Domain: translator.bigmachini.net
#
# This file deliberately has no SSL configuration. Run Certbot after Nginx is
# serving this HTTP site to add certificates and HTTPS redirects.

server {
    listen 80;
    listen [::]:80;
    server_name translator.bigmachini.net;

    # The app only accepts up to 4,000 characters. Keep a small safety margin
    # for the JSON envelope while rejecting unexpectedly large requests early.
    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:5800;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
